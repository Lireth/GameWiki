# 部署到 GitHub Pages（项目站点：https://<owner>.github.io/GameWiki/）。
# 前置条件：仓库 Settings → Pages → Source 选择「GitHub Actions」，
# 未开启时本工作流的 deploy 阶段会失败提示。
# 子路径构建通过 DEPLOY_BASE 注入（默认仓库名，fork 后自动跟随仓库名）。
# 触发：push 到 main 触发的 CI 成功后才部署（workflow_run 门禁，checkout
# 固定到 CI 验证过的同一 commit，坏产物不会上线）；CI 失败或 PR 触发的 CI
# 不部署。工作流文件变更等无 CI 参与的场景可用 workflow_dispatch 手动部署。
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 触发时部署 CI 验证过的同一 commit；手动触发时为默认分支 HEAD
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建子路径版本
        run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
      # enablement: true — Pages 未开启时通过 API 自动开通（需 pages: write 权限，已声明）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
