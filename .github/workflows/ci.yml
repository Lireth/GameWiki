name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 包体预算检查
        run: npm run check:size
      - name: 部署资源断言（public 图片资产须随仓库提交，防线上 404）
        run: |
          test -f dist/sw.js
          test -f dist/og.png
          for dir in avatars cones relics; do
            if [ -z "$(ls "dist/$dir" 2>/dev/null)" ]; then
              echo "::error::dist/$dir 为空：public/$dir 未随仓库提交，部署后线上将 404"
              exit 1
            fi
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
